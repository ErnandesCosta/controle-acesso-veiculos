services:
  frontend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      - backend
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - app-network

  backend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/backend/Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: LocalContainer
      ASPNETCORE_URLS: http://+:8080
      # O Compose local usa senha, não Kerberos. Em produção, configure TLS ou GSSAPI explicitamente.
      ConnectionStrings__DefaultConnection: "Host=postgresql;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY:?Defina JWT_SIGNING_KEY no arquivo .env}
      DataProtection__Enabled: "true"
      DataProtection__ApplicationName: controle-acesso-veiculos
      DataProtection__KeyRingPath: /var/lib/controle-acesso-veiculos/data-protection
      DataProtection__CertificatePath: /run/secrets/data-protection-certificate.pfx
      DataProtection__CertificatePasswordFile: /run/secrets/data-protection-certificate-password
      Observability__Enabled: ${OTEL_ENABLED:-false}
      Observability__ServiceName: ${OTEL_SERVICE_NAME:-controle-acesso-veiculos-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    depends_on:
      postgresql:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - data-protection-keys:/var/lib/controle-acesso-veiculos/data-protection
    secrets:
      - source: data-protection-certificate
        target: data-protection-certificate.pfx
      - source: data-protection-certificate-password
        target: data-protection-certificate-password
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - app-network

  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  data-protection-keys:

secrets:
  data-protection-certificate:
    file: ${DATA_PROTECTION_CERTIFICATE_FILE:-./secrets/data-protection.pfx}
  data-protection-certificate-password:
    file: ${DATA_PROTECTION_CERTIFICATE_PASSWORD_FILE:-./secrets/data-protection-password.txt}
